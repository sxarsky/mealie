# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/mealie
  repoUrl: https://github.com/sxarsky/mealie
metadata:
  schemaVersion: v1
  mcpVersion: 0.3.0
  executorVersion: v1.3.34
services:
  - serviceName: mealie-backend
    language: python
    framework: pytest
    testDirectory: tests
    api:
      schemaPath: http://localhost:9000/openapi.json
      authType: bearer
      authHeader: Authorization
      baseUrl: http://mealie-testb:9000
    runtimeDetails:
      runtime: docker
      dockerNetwork: deployment-testbot_default
  - serviceName: mealie-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/frontend
    api:
      authType: bearer
      authHeader: Authorization
      baseUrl: http://mealie-testb:9000
    runtimeDetails:
      runtime: docker
      dockerNetwork: deployment-testbot_default
