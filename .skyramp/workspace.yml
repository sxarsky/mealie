# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/mealie
  repoUrl: https://github.com/sxarsky/mealie
metadata:
  schemaVersion: v1
  mcpVersion: 0.2.8
  executorVersion: v1.3.29
  createdAt: "2026-06-25T07:27:34.868Z"
  updatedAt: "2026-06-25T07:27:34.876Z"
services:
  - serviceName: mealie-backend
    language: python
    framework: pytest
    testDirectory: tests
    api:
      schemaPath: http://localhost:9000/openapi.json
      authType: bearer
      baseUrl: http://localhost:9000
    runtimeDetails:
      serverStartCommand: docker compose -f deployment-testbot/docker-compose.yml up -d mealie
      runtime: docker
      dockerNetwork: mealie_default
  - serviceName: mealie-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/e2e
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:9000
    runtimeDetails:
      serverStartCommand: docker compose -f deployment-testbot/docker-compose.yml up -d mealie
      runtime: docker
      dockerNetwork: mealie_default
